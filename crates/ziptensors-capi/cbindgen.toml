# cbindgen configuration of include/ziptensors.h. `tests/header.rs` regenerates the header from this
# file and fails when the checked-in copy differs; see src/MODULE_README.md for how to refresh it.

language = "C"
include_guard = "ZIPTENSORS_H"
header = "/* ziptensors C ABI. Generated by cbindgen from crates/ziptensors-capi/src. Do not edit. */"
style = "both"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
line_length = 100

[export]
# These appear in option structs or parameters as raw integers, so no signature reaches them.
include = ["ZtMode", "ZtVerify", "ZtStrategy", "ZtLogLevel"]

[export.rename]
ZtStatus = "zt_status"
ZtMode = "zt_mode"
ZtVerify = "zt_verify"
ZtContainer = "zt_container"
ZtMember = "zt_member"
ZtPack = "zt_pack"
ZtOpenOptions = "zt_open_options"
ZtEncodeOptions = "zt_encode_options"
ZtTensorDesc = "zt_tensor_desc"
ZtMemberDesc = "zt_member_desc"
ZtStrategy = "zt_strategy"
ZtLogLevel = "zt_log_level"
ZtEditOp = "zt_edit_op"
ZtEditOptions = "zt_edit_options"
ZtRecoverOptions = "zt_recover_options"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
